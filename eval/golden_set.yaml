# Эталонный набор вопросов для оценки качества.
#
# Как собран: вопросы написаны по тексту самих документов, а НЕ по выдаче
# поиска. Это принципиально — если формулировать вопросы, подглядывая в то,
# что система находит, метрики покажут не качество системы, а качество
# подгонки под неё.
#
# Разбит на группы, и метрики считаются по каждой отдельно: средняя цифра
# по всему набору скрывает ровно то, что интереснее всего.
#
#   direct  — прямой вопрос терминами документации. Базовый уровень.
#   natural — «как спросил бы живой человек»: своими словами, от задачи,
#             а не от термина. Здесь векторный поиск должен обыгрывать
#             словесный.
#   similar — различение похожих страниц справочника (filter против map,
#             let против const). Самое слабое место обычного поиска: текст
#             у таких страниц почти дословно совпадает.
#   trap    — ловушки: правдоподобные вопросы про веб, ответа на которые
#             в корпусе НЕТ. Правильное поведение — признаться, что ответа
#             нет. Здесь обычно и вылезает выдумывание.
#   cross   — ответ требует нескольких документов сразу.
#
# expected_slugs: приемлемые документы-источники. Их может быть несколько:
# на вопрос «чем filter отличается от map» верным будет любой из двух.
# Пустой список означает ловушку — верного документа не существует.

version: 1

questions:
  # --- Прямые вопросы ----------------------------------------------------

  - id: d01
    group: direct
    question: Что возвращает метод filter у массива?
    expected_slugs:
